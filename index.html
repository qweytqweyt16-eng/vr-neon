<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>THE HOLLOW — VR Horror</title>
<style>
  body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #ff0000;
    font-family: 'Courier New', Courier, monospace;
    -webkit-user-select: none; user-select: none;
  }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 20px;
    background: radial-gradient(circle at 50% 50%, #1a0000 0%, #000000 80%);
  }
  #overlay.hidden { display: none; }
  h1 {
    margin: 0; font-size: clamp(40px, 10vw, 90px);
    letter-spacing: .1em; color: #8a0303;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #8a0303;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { opacity: 0.8; text-shadow: 0 0 10px #ff0000; }
    50% { opacity: 1; text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000; }
    100% { opacity: 0.8; text-shadow: 0 0 10px #ff0000; }
  }
  #status { max-width: 600px; line-height: 1.6; font-size: 1.2rem; color: #ccc; }
  button {
    font-family: inherit; font-size: 1.5rem; letter-spacing: .2em; padding: 15px 50px;
    color: #fff; background: #5a0000; border: 2px solid #ff0000; border-radius: 5px;
    box-shadow: 0 0 15px #ff0000; cursor: pointer; transition: 0.2s; font-weight: bold;
  }
  button:hover { background: #8a0303; box-shadow: 0 0 30px #ff0000; }
  button:disabled { opacity: .2; filter: grayscale(1); cursor: default; }
  #hint { max-width: 600px; font-size: 0.9rem; color: #666; border-top: 1px solid #330000; padding-top: 15px; margin-top: 20px; }
</style>
</head>
<body>

<div id="overlay">
  <h1>THE HOLLOW</h1>
  <div id="status">Looking for VR hardware...</div>
  <button id="startBtn" style="display:none" disabled>ENTER THE VOID</button>
  <div id="hint">
    WARNING: Contains flashing lights and intense audio. <br>
    <b>RIGHT HAND:</b> Flashlight &nbsp;•&nbsp; <b>GOAL:</b> Find 3 glowing doors. <br>
    <b>SURVIVAL:</b> Shine your flashlight directly at the entity to freeze it.
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const overlayEl = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

let xrSupported = false;

navigator.xr?.isSessionSupported('immersive-vr').then(supported => {
  xrSupported = supported;
  if (supported) {
    statusEl.innerHTML = 'Headset detected.<br>Put it on and press the button.';
    startBtn.disabled = false;
    startBtn.style.display = 'inline-block';
  } else {
    statusEl.innerHTML = 'VR headset not found. This experience requires WebXR.';
  }
}).catch(() => {
  statusEl.innerHTML = 'WebXR error. Please use a compatible browser.';
});

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
// Thick fog to make it scary
scene.fog = new THREE.FogExp2(0x000000, 0.1);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);

// --- LIGHTING ---
// Barely any ambient light
scene.add(new THREE.AmbientLight(0x111111, 0.2));

// Red glowing light from doors
const doorLight = new THREE.PointLight(0xff0000, 0, 15);
scene.add(doorLight);

// Flashlight (Attached to right hand)
const flashlight = new THREE.SpotLight(0xffffff, 8, 40, Math.PI / 5, 0.4, 1);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
scene.add(flashlight);
scene.add(flashlight.target);

// --- AUDIO SYSTEM ---
let actx = null;
function initAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume();
}

// Atmospheric Drone
let droneOsc = null;
function startDrone() {
  if (!actx || droneOsc) return;
  droneOsc = actx.createOscillator();
  const gain = actx.createGain();
  droneOsc.type = 'sawtooth';
  droneOsc.frequency.value = 40; // Deep rumble
  gain.gain.value = 0.08;
  droneOsc.connect(gain).connect(actx.destination);
  droneOsc.start();
}

// Heartbeat
let heartTimer = 0;
function playHeartbeat() {
  if (!actx) return;
  const t = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(60, t);
  osc.frequency.exponentialRampToValueAtTime(30, t + 0.15);
  gain.gain.setValueAtTime(0.3, t);
  gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
  osc.connect(gain).connect(actx.destination);
  osc.start(t);
  osc.stop(t + 0.35);
}

// Scream
function playScream() {
  if (!actx) return;
  const t = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(800, t);
  osc.frequency.exponentialRampToValueAtTime(100, t + 1.0);
  gain.gain.setValueAtTime(0.6, t);
  gain.gain.exponentialRampToValueAtTime(0.01, t + 1.5);
  osc.connect(gain).connect(actx.destination);
  osc.start(t);
  osc.stop(t + 1.5);
}

// --- ENVIRONMENT ---
// Floor (Slightly reflective)
const floorGeo = new THREE.PlaneGeometry(200, 200);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.5, metalness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Pillars to get lost in
const pillarGeo = new THREE.BoxGeometry(1.5, 10, 1.5);
const pillarMat = new THREE.MeshStandardMaterial({ color: 0x151515 });
for (let i = 0; i < 60; i++) {
  const pillar = new THREE.Mesh(pillarGeo, pillarMat);
  const angle = Math.random() * Math.PI * 2;
  const dist = 4 + Math.random() * 45;
  pillar.position.set(Math.cos(angle) * dist, 5, Math.sin(angle) * dist);
  pillar.rotation.y = Math.random() * Math.PI;
  scene.add(pillar);
}

// Doors
const doors = [];
function spawnDoor() {
  // Create a glowing door
  const geo = new THREE.BoxGeometry(2, 4, 0.2);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  const door = new THREE.Mesh(geo, mat);
  
  const angle = Math.random() * Math.PI * 2;
  const dist = 12 + Math.random() * 15; // Spawn 12-27 meters away
  door.position.set(Math.cos(angle) * dist, 2, Math.sin(angle) * dist);
  door.lookAt(0, 2, 0);
  
  // Add a glowing halo behind it
  const haloGeo = new THREE.PlaneGeometry(3, 5);
  const haloMat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
  const halo = new THREE.Mesh(haloGeo, haloMat);
  halo.position.z = -0.1;
  door.add(halo);
  
  scene.add(door);
  doors.push(door);
}

// --- THE ENTITY ---
const entityGroup = new THREE.Group();
const bodyGeo = new THREE.CapsuleGeometry(0.4, 1.8, 4, 8);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 1.4;
entityGroup.add(body);

const headGeo = new THREE.DodecahedronGeometry(0.4, 1);
const headMat = new THREE.MeshStandardMaterial({ color: 0x050000, roughness: 0.1 });
const head = new THREE.Mesh(headGeo, headMat);
head.position.y = 2.6;
head.scale.set(0.8, 1.3, 0.8);
entityGroup.add(head);

// Glowing Eyes
const eyeGeo = new THREE.SphereGeometry(0.06, 8, 8);
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const eye1 = new THREE.Mesh(eyeGeo, eyeMat); eye1.position.set(-0.15, 2.65, -0.35); entityGroup.add(eye1);
const eye2 = new THREE.Mesh(eyeGeo, eyeMat); eye2.position.set(0.15, 2.65, -0.35); entityGroup.add(eye2);

// Creepy long arms
const armGeo = new THREE.CylinderGeometry(0.06, 0.02, 2.0, 6);
const arm1 = new THREE.Mesh(armGeo, bodyMat); arm1.position.set(-0.45, 1.4, 0); arm1.rotation.z = 0.3; entityGroup.add(arm1);
const arm2 = new THREE.Mesh(armGeo, bodyMat); arm2.position.set(0.45, 1.4, 0); arm2.rotation.z = -0.3; entityGroup.add(arm2);

scene.add(entityGroup);

// --- GAME STATE ---
const state = {
  active: false,
  over: false,
  doorsFound: 0,
  totalDoors: 3,
  entitySpeed: 1.2,
  entityFrozen: false,
  lastHeartbeat: 0,
  headPos: new THREE.Vector3(),
  flashlightOn: true
};

// --- CONTROLLERS ---
const controllers = [];
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  
  // Simple hand mesh
  const handGeo = new THREE.CylinderGeometry(0.02, 0.03, 0.15, 8);
  const handMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
  const hand = new THREE.Mesh(handGeo, handMat);
  hand.rotation.x = Math.PI / 2;
  c.add(hand);

  // Attach flashlight to right hand (index 1)
  if (i === 1) {
    c.add(flashlight);
    flashlight.position.set(0, -0.05, -0.1);
    c.add(flashlight.target);
  }

  scene.add(c);
  controllers.push(c);
}

// --- VR SESSION ---
function requestVRSession() {
  if (!xrSupported || !navigator.xr) return;
  initAudio();
  
  navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] })
    .then(async (session) => {
      session.addEventListener('end', onSessionEnd);
      await renderer.xr.setSession(session);
      overlayEl.classList.add('hidden');
      setTimeout(() => { if (renderer.xr.isPresenting) startGame(); }, 200);
    })
    .catch((err) => {
      console.error(err);
      statusEl.textContent = 'Error: ' + err.message;
      startBtn.disabled = false;
    });
}
startBtn.addEventListener('click', requestVRSession);
startBtn.addEventListener('pointerdown', requestVRSession);

function onSessionEnd() {
  state.active = false;
  overlayEl.classList.remove('hidden');
  startBtn.disabled = false;
  startBtn.textContent = 'ENTER THE VOID';
  if (droneOsc) { droneOsc.stop(); droneOsc = null; }
}

// --- GAME LOGIC ---
function startGame() {
  state.active = true;
  state.over = false;
  state.doorsFound = 0;
  state.entityFrozen = false;
  
  doors.forEach(d => scene.remove(d));
  doors.length = 0;
  
  spawnDoor();
  
  // Spawn entity far away
  entityGroup.position.set(0, 0, -20); 
  
  initAudio();
  startDrone();
}

function gameOver() {
  state.active = false;
  state.over = true;
  playScream();
  startBtn.textContent = 'YOU DIED. TRY AGAIN?';
  overlayEl.classList.remove('hidden');
}

function winGame() {
  state.active = false;
  state.over = true;
  startBtn.textContent = 'YOU ESCAPED';
  overlayEl.classList.remove('hidden');
  if (droneOsc) { droneOsc.stop(); droneOsc = null; }
}

// --- UPDATE LOOP ---
const clock = new THREE.Clock();
const raycaster = new THREE.Raycaster();

function update(dt) {
  if (!state.active) return;

  const cam = renderer.xr.getCamera();
  cam.updateWorldMatrix(true, false);
  state.headPos.setFromMatrixPosition(cam.matrixWorld);

  if (state.doorsFound >= state.totalDoors) {
    winGame();
    return;
  }

  // --- ENTITY AI ---
  const distToPlayer = entityGroup.position.distanceTo(state.headPos);
  
  // Create a raycast from the flashlight
  const flashMatrix = new THREE.Matrix4().extractRotation(flashlight.matrixWorld);
  const flashDir = new THREE.Vector3(0, 0, -1).applyMatrix4(flashMatrix).normalize();
  const flashPos = new THREE.Vector3().setFromMatrixPosition(flashlight.matrixWorld);
  
  raycaster.set(flashPos, flashDir);
  raycaster.far = 20; // Flashlight range
  
  // Check if the flashlight beam hits the entity
  const intersect = raycaster.intersectObject(body);
  const hitByLight = intersect.length > 0 && intersect[0].distance < 15;
  
  state.entityFrozen = hitByLight;

  if (!state.entityFrozen) {
    // Move towards player
    const moveDir = state.headPos.clone().sub(entityGroup.position);
    moveDir.y = 0;
    moveDir.normalize();
    
    const speed = distToPlayer < 6 ? state.entitySpeed * 2.0 : state.entitySpeed;
    entityGroup.position.addScaledVector(moveDir, speed * dt);
    
    // Creepy head bob
    entityGroup.rotation.y += dt * 3;
    entityGroup.position.y = Math.sin(state.time * 5) * 0.1;
  } else {
    // Shake when frozen
    entityGroup.position.x += (Math.random() - 0.5) * 0.03;
    entityGroup.position.y += (Math.random() - 0.5) * 0.03;
  }

  // Look at player
  const lookPos = state.headPos.clone();
  lookPos.y = entityGroup.position.y + 1.5;
  entityGroup.lookAt(lookPos);

  // --- AUDIO & DAMAGE ---
  if (distToPlayer < 20) {
    const hbRate = distToPlayer < 6 ? 0.25 : (distToPlayer < 12 ? 0.5 : 0.9);
    if (state.lastHeartbeat <= 0) {
      playHeartbeat();
      state.lastHeartbeat = hbRate;
    } else {
      state.lastHeartbeat -= dt;
    }
  }

  if (distToPlayer < 1.0) {
    gameOver();
  }

  // --- DOOR COLLISION ---
  for (let i = doors.length - 1; i >= 0; i--) {
    const d = doors[i];
    if (d.position.distanceTo(state.headPos) < 1.5) {
      scene.remove(d);
      doors.splice(i, 1);
      state.doorsFound++;
      
      if (state.doorsFound < state.totalDoors) {
        spawnDoor();
      }
      
      // Reset entity position to give player a breather
      entityGroup.position.set(0, 0, -25); 
    }
  }

  // Pulse door light
  if (doors.length > 0) {
    doorLight.position.copy(doors[0].position);
    doorLight.intensity = 3 + Math.sin(state.time * 15) * 2;
  }
}

state.time = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  state.time += dt;
  update(dt);
  renderer.render(scene, camera);
});

</script>
</body>
</html>
