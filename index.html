let xrSupported = false;

(async function detectXR() {
  if (!navigator.xr) {
    statusEl.innerHTML = 'WebXR is not available in this browser.<br>Open this page in the <b>Meta Quest Browser</b> on your headset.';
    startBtn.style.display = 'none';
    return;
  }
  try {
    xrSupported = await navigator.xr.isSessionSupported('immersive-vr');
  } catch (e) {
    xrSupported = false;
  }
  if (xrSupported) {
    statusEl.innerHTML = 'VR headset detected.<br>Put on your headset, then press <b>START</b>.';
    startBtn.disabled = false;
    startBtn.style.display = 'inline-block';
  } else {
    statusEl.innerHTML = 'No VR headset found.<br>This experience requires a <b>Meta Quest 2</b> (or another WebXR headset).';
    startBtn.style.display = 'none';
  }
})();

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

let hudDirty = true;
function drawHUD() {
  const w = hudCanvas.width, h = hudCanvas.height;
  hctx.clearRect(0, 0, w, h);
  hctx.fillStyle = 'rgba(5, 14, 28, 0.86)'; roundRect(hctx, 4, 4, w - 8, h - 8, 24); hctx.fill();
  hctx.strokeStyle = 'rgba(0, 229, 255, 0.55)'; hctx.lineWidth = 4; roundRect(hctx, 4, 4, w - 8, h - 8, 24); hctx.stroke();
  hctx.textBaseline = 'middle';
  hctx.textAlign = 'left'; hctx.font = 'bold 42px ui-monospace, monospace'; hctx.fillStyle = '#7df9ff';
  hctx.fillText('WAVE ' + String(state.wave).padStart(2, '0'), 26, 50);
  hctx.textAlign = 'right'; hctx.fillStyle = '#ffdf6b';
  hctx.fillText(String(state.score).padStart(6, '0'), w - 26, 50);

  hctx.fillStyle = 'rgba(0, 0, 0, 0.65)'; roundRect(hctx, bx, by, bw, bh, 14); hctx.fill();

      hctx.fillStyle = grd;

  hctx.strokeStyle = 'rgba(125, 249, 255, 0.35)'; hctx.lineWidth = 2; roundRect(hctx, bx, by, bw, bh, 14); hctx.stroke();
  hctx.textAlign = 'center'; hctx.font = 'bold 30px ui-monospace, monospace'; hctx.fillStyle = '#eafcff';

let actx = null;

const P_MAX = 600;
const pPos = new Float32Array(P_MAX * 3), pCol = new Float32Array(P_MAX * 3), pVel = new Float32Array(P_MAX * 3), pBase = new Float32Array(P_MAX * 3), pLife = new Float32Array(P_MAX), pMaxLife = new Float32Array(P_MAX);
let pCursor = 0;
for (let i = 0; i < P_MAX; i++) pPos[i * 3 + 1] = -999;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));

const _tmpColor = new THREE.Color();

function spawnParticles(pos, color, count, speed, life) {
  life = life || 0.75;
  for (let k = 0; k < count; k++) {
    const i = pCursor; pCursor = (pCursor + 1) % P_MAX;
    pPos[i * 3] = pos.x; pPos[i * 3 + 1] = pos.y; pPos[i * 3 + 2] = pos.z;
    let vx = Math.random() - 0.5, vy = Math.random() - 0.5, vz = Math.random() - 0.5;
    const m = Math.hypot(vx, vy, vz) || 1; const s = speed * (0.35 + Math.random() * 0.95);
    pVel[i * 3] = (vx / m) * s; pVel[i * 3 + 1] = (vy / m) * s; pVel[i * 3 + 2] = (vz / m) * s;
    pBase[i * 3] = color.r; pBase[i * 3 + 1] = color.g; pBase[i * 3 + 2] = color.b;
    pLife[i] = life * (0.55 + Math.random() * 0.9); pMaxLife[i] = pLife[i];
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}

function updateParticles(dt) {
  let touched = false; const drag = Math.pow(0.055, dt);
  for (let i = 0; i < P_MAX; i++) {
    if (pLife[i] <= 0) continue;
    touched = true; pLife[i] -= dt;
    if (pLife[i] <= 0) { pCol[i * 3] = pCol[i * 3 + 1] = pCol[i * 3 + 2] = 0; pPos[i * 3 + 1] = -999; continue; }
    pVel[i * 3] *= drag; pVel[i * 3 + 1] *= drag; pVel[i * 3 + 2] *= drag;
    pPos[i * 3] += pVel[i * 3] * dt; pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt; pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    const f = pLife[i] / pMaxLife[i];
    pCol[i * 3] = pBase[i * 3] * f; pCol[i * 3 + 1] = pBase[i * 3 + 1] * f; pCol[i * 3 + 2] = pBase[i * 3 + 2] * f;
  }
  if (touched) { pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true; }
}

const tracers = []; let tracerCursor = 0;
for (let i = 0; i < 24; i++) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3).setUsage(THREE.DynamicDrawUsage));

function spawnTracer(a, b, colorHex) {
  const t = tracers[tracerCursor]; tracerCursor = (tracerCursor + 1) % tracers.length;
  const attr = t.line.geometry.attributes.position;
  attr.array[0] = a.x; attr.array[1] = a.y; attr.array[2] = a.z;
  attr.array[3] = b.x; attr.array[4] = b.y; attr.array[5] = b.z;

function updateTracers(dt) {

    hp: isBig ? 4 : 1, speed: Math.min((isBig ? 1.15 : 1.75) + wave * 0.11, 4.6),
    radius: isBig ? 0.5 : 0.3, damage: isBig ? 22 : 9, points: isBig ? 40 : 10,

function explodeEnemy(e, count) { spawnParticles(e.obj.position, e.color, count, 4.5, 0.9); }

function updateEnemies(dt, headPos) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    _v1.copy(headPos).add(e.offset); _v2.copy(_v1).sub(e.pos);
    const distToPlayer = e.pos.distanceTo(headPos);
    if (_v2.lengthSq() > 0.0001) { _v2.normalize(); e.pos.addScaledVector(_v2, e.speed * dt); }
    e.phase += dt * 2.6; const wob = Math.sin(e.phase) * 0.22;
    e.obj.position.copy(e.pos).addScaledVector(e.perp, wob);
    e.obj.rotation.y += dt * 1.7; e.obj.rotation.x += dt * 0.95;
    if (distToPlayer < e.radius + 0.8) {
      damagePlayer(e.damage); explodeEnemy(e, 28); removeEnemyAt(i);
    }
  }
}

const state = {
  active: false, over: false, score: 0, health: 100, maxHealth: 100, wave: 0, toSpawn: 0,
  spawnTimer: 0, spawnInterval: 1.5, waveDelay: 0, kills: 0, time: 0, restartLock: 0,
  headPos: new THREE.Vector3(0, 1.6, 0), headQuat: new THREE.Quaternion()
};

function createPanel(canvasW, canvasH, worldW, drawFn) {
  const cv = document.createElement('canvas'); cv.width = canvasW; cv.height = canvasH;
  const ctx = cv.getContext('2d'); drawFn(ctx, canvasW, canvasH);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, fog: false });
  const geo = new THREE.PlaneGeometry(worldW, worldW * canvasH / canvasW);
  const mesh = new THREE.Mesh(geo, mat); mesh.userData.tex = tex; return mesh;
}

function disposePanel(mesh) {
  if (!mesh) return;
  scene.remove(mesh); mesh.geometry.dispose();
  if (mesh.userData.tex) mesh.userData.tex.dispose();
  mesh.material.dispose();
}

let bannerMesh = null, bannerLife = 0;

function showBanner(title, subtitle, colorHex, duration) {
  colorHex = colorHex || '#7df9ff'; duration = duration || 2.0;
  disposePanel(bannerMesh); bannerMesh = null;
  bannerMesh = createPanel(512, 256, 1.7, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 84px ui-monospace, monospace'; ctx.shadowColor = colorHex; ctx.shadowBlur = 32;
    ctx.fillStyle = colorHex; ctx.fillText(title, w / 2, h * 0.37);
    ctx.shadowBlur = 10; ctx.font = '32px ui-monospace, monospace'; ctx.fillStyle = '#cfe9ff';
    ctx.fillText(subtitle, w / 2, h * 0.74); ctx.shadowBlur = 0;
  });
  const head = getHeadPosition().clone(); const fwd = getHeadForward().clone();
  bannerMesh.position.copy(head).addScaledVector(fwd, 2.6); bannerMesh.lookAt(head);
  scene.add(bannerMesh); bannerLife = duration;
}

let overMesh = null;
function removeOverPanel() { disposePanel(overMesh); overMesh = null; }

function showGameOver() {
  removeOverPanel();
  overMesh = createPanel(512, 340, 1.9, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(12, 0, 22, 0.90)'; roundRect(ctx, 6, 6, w - 12, h - 12, 28); ctx.fill();
    ctx.strokeStyle = 'rgba(255, 59, 107, 0.95)'; ctx.lineWidth = 6; roundRect(ctx, 6, 6, w - 12, h - 12, 28); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 78px ui-monospace, monospace'; ctx.shadowColor = '#ff3b6b'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#ff3b6b'; ctx.fillText('GAME OVER', w / 2, 78); ctx.shadowBlur = 0;
    ctx.font = 'bold 52px ui-monospace, monospace'; ctx.fillStyle = '#7df9ff'; ctx.fillText('SCORE ' + state.score, w / 2, 172);
    ctx.font = '36px ui-monospace, monospace'; ctx.fillStyle = '#cfe9ff'; ctx.fillText('WAVE ' + state.wave, w / 2, 230);
    ctx.font = 'bold 32px ui-monospace, monospace'; ctx.fillStyle = '#ffdf6b'; ctx.fillText('PRESS TRIGGER TO RESTART', w / 2, 300);
  });
  const head = getHeadPosition().clone(); const fwd = getHeadForward().clone();
  overMesh.position.copy(head).addScaledVector(fwd, 2.2); overMesh.lookAt(head);
  overMesh.material.depthTest = false; overMesh.renderOrder = 900; scene.add(overMesh);
}

function getHeadPosition() {
  if (renderer.xr.isPresenting) {
    const cam = renderer.xr.getCamera(); cam.updateWorldMatrix(true, false);
    state.headPos.setFromMatrixPosition(cam.matrixWorld);
  } else {
    camera.updateWorldMatrix(true, false); state.headPos.setFromMatrixPosition(camera.matrixWorld);
  }
  return state.headPos;
}
function getHeadForward() {
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  cam.updateWorldMatrix(true, false); cam.getWorldQuaternion(_q2);
  _v3.set(0, 0, -1).applyQuaternion(_q2).normalize(); return _v3;
}

const raycaster = new THREE.Raycaster(); raycaster.far = 120;

function fireController(c) {
  if (!state.active) return;
  c.updateWorldMatrix(true, false);
  const origin = _v1.setFromMatrixPosition(c.matrixWorld).clone();
  c.getWorldQuaternion(_q);
  const dir = _v2.set(0, 0, -1).applyQuaternion(_q).normalize().clone();
  const muzzle = origin.clone().addScaledVector(dir, 0.20);
  raycaster.set(muzzle, dir); raycaster.far = 120;
  const hits = raycaster.intersectObjects(enemyGroup.children, true);
  let endPoint = muzzle.clone().addScaledVector(dir, 60); let hitSomething = false;
  if (hits.length > 0) {
    endPoint = hits[0].point.clone();
    let o = hits[0].object; let target = null;
    while (o) { if (o.userData && o.userData.enemy) { target = o.userData.enemy; break; } o = o.parent; }
    if (target) { hitSomething = true; damageEnemy(target, 1, endPoint); }
  }
  spawnTracer(muzzle, endPoint, hitSomething ? 0xffe28f : 0x8ffcff);
  if (hitSomething) sfx.hit(); sfx.shoot();
}

function damageEnemy(e, dmg, hitPoint) {
  e.hp -= dmg;
  if (e.hp <= 0) {
    const idx = enemies.indexOf(e);
    if (idx !== -1) { explodeEnemy(e, 34); removeEnemyAt(idx); state.score += e.points; state.kills++; hudDirty = true; sfx.kill(); }
  } else { spawnParticles(hitPoint, e.color, 9, 2.8, 0.45); }
}

function damagePlayer(amount) {
  if (!state.active) return;
  state.health -= amount; hudDirty = true; sfx.damage();
  _v1.copy(getHeadPosition()).addScaledVector(getHeadForward(), 1.2);
  spawnParticles(_v1, new THREE.Color(0xff2244), 18, 3.0, 0.5);
  if (state.health <= 0) { state.health = 0; gameOver(); }
}

function nextWave() {
  state.wave++; state.toSpawn = Math.min(4 + Math.floor(state.wave * 2.2), 30);
  state.spawnInterval = Math.max(0.28, 1.5 - state.wave * 0.11); state.spawnTimer = 0.35; hudDirty = true;
  const sub = state.wave === 1 ? 'Pull the trigger to fire' : 'Incoming — ' + state.toSpawn + ' contacts';
  showBanner('WAVE ' + state.wave, sub, '#7df9ff', 1.8); sfx.wave();
}

function startGame() {
  for (let i = enemies.length - 1; i >= 0; i--) removeEnemyAt(i);
  state.score = 0; state.health = state.maxHealth; state.wave = 0; state.kills = 0;
  state.toSpawn = 0; state.spawnTimer = 0; state.spawnInterval = 1.5; state.waveDelay = 1.2;
  state.active = true; state.over = false; state.restartLock = 0.9; state.time = 0;
  for (const c of controllers) { c.userData.pressed = false; c.userData.cooldown = 0; }
  removeOverPanel(); hudDirty = true;
  showBanner('NEON VOID', 'Survive the swarm', '#7df9ff', 2.4);
}

function gameOver() {
  state.active = false; state.over = true; state.restartLock = 1.0;
  for (const c of controllers) c.userData.pressed = false;
  for (let i = enemies.length - 1; i >= 0; i--) { explodeEnemy(enemies[i], 18); removeEnemyAt(i); }
  showGameOver(); sfx.over();
}

const clock = new THREE.Clock();
function update(dt) {
  state.time += dt; if (state.restartLock > 0) state.restartLock -= dt;
  getHeadPosition();
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  cam.getWorldQuaternion(state.headQuat);
  starGroup.rotation.y += dt * 0.008;
  for (let i = 0; i < rings.length; i++) { rings[i].rotation.z += dt * (0.10 + i * 0.05); rings[i].rotation.y += dt * (0.04 + i * 0.03); }
  platformRing.material.opacity = 0.65 + Math.sin(state.time * 2.0) * 0.25;
  updateParticles(dt); updateTracers(dt);

  if (state.active) {
    if (state.waveDelay > 0) { state.waveDelay -= dt; if (state.waveDelay <= 0) nextWave(); }
    else if (state.toSpawn > 0) {
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) { spawnEnemy(); state.toSpawn--; state.spawnTimer = state.spawnInterval; }
    } else if (enemies.length === 0) {
      state.health = Math.min(state.maxHealth, state.health + 15);
      const bonus = 50 * state.wave; state.score += bonus; state.waveDelay = 2.0; hudDirty = true;
      showBanner('WAVE CLEAR', '+' + bonus + ' BONUS   •   +15 HP', '#00ffb3', 1.8); sfx.wave();
    }
    updateEnemies(dt, state.headPos);
    for (let i = 0; i < controllers.length; i++) {
      const c = controllers[i]; c.userData.cooldown -= dt;
      if (c.userData.pressed && c.userData.cooldown <= 0) { fireController(c); c.userData.cooldown = 0.13; }
    }
  }

  if (bannerMesh) {
    bannerLife -= dt; bannerMesh.material.opacity = Math.max(0, Math.min(1, bannerLife));
    if (bannerLife <= 0) { disposePanel(bannerMesh); bannerMesh = null; }
  }
  if (hudDirty && hudMesh.visible) drawHUD();
}

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt); renderer.render(scene, camera);
});

// THIS IS THE CRITICAL FIX: Explicitly requesting session without blocking default behavior
function requestVRSession() {
  if (!xrSupported || !navigator.xr) return;
  initAudio();
  navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'layers'] })
    .then(async (session) => {
      session.addEventListener('end', onSessionEnd);
      await renderer.xr.setSession(session);
      overlayEl.classList.add('hidden');
      setTimeout(() => { if (renderer.xr.isPresenting) startGame(); }, 200);
    })
    .catch((err) => {
      console.error(err);
      statusEl.textContent = 'Error: ' + (err && err.message ? err.message : err);
      startBtn.disabled = false;
    });
}

// Attach to both click AND touch/pointer events for maximum compatibility
startBtn.addEventListener('click', requestVRSession);
startBtn.addEventListener('pointerdown', requestVRSession);

function onSessionEnd() {
  state.active = false; state.over = false;
  for (let i = enemies.length - 1; i >= 0; i--) removeEnemyAt(i);
  for (const c of controllers) c.userData.pressed = false;
  disposePanel(bannerMesh); bannerMesh = null; removeOverPanel();
  overlayEl.classList.remove('hidden');
  statusEl.innerHTML = 'VR session ended.<br>Put your headset back on and press <b>START</b>.';
  startBtn.disabled = false;
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') initAudio();
});

drawHUD();
</script>
