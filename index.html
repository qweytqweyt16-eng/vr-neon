<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>THE HOLLOW — VR Horror</title>
<style>
  body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #ff0000;
    font-family: 'Courier New', Courier, monospace;
    -webkit-user-select: none; user-select: none;
  }
  canvas { display: block; }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 20px;
    background: radial-gradient(circle at 50% 50%, #1a0000 0%, #000000 80%);
  }
  #overlay.hidden { display: none; }

  h1 {
    margin: 0; font-size: clamp(40px, 10vw, 90px);
    letter-spacing: .1em; color: #8a0303;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #8a0303;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { opacity: 0.8; text-shadow: 0 0 10px #ff0000; }
    50% { opacity: 1; text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000; }
    100% { opacity: 0.8; text-shadow: 0 0 10px #ff0000; }
  }
  
  #status { max-width: 600px; line-height: 1.6; font-size: 1.2rem; color: #ccc; }
  button {
    font-family: inherit; font-size: 1.5rem; letter-spacing: .2em; padding: 15px 50px;
    color: #fff; background: #5a0000; border: 2px solid #ff0000; border-radius: 5px;
    box-shadow: 0 0 15px #ff0000; cursor: pointer; transition: 0.2s; font-weight: bold;
  }
  button:hover { background: #8a0303; box-shadow: 0 0 30px #ff0000; }
  button:disabled { opacity: .2; filter: grayscale(1); cursor: default; }
  #hint { max-width: 600px; font-size: 0.9rem; color: #666; border-top: 1px solid #330000; padding-top: 15px; margin-top: 20px; }
</style>
</head>
<body>

<div id="overlay">
  <h1>THE HOLLOW</h1>
  <div id="status">Looking for VR hardware...</div>
  <button id="startBtn" style="display:none" disabled>ENTER THE VOID</button>
  <div id="hint">
    WARNING: Contains flashing lights and intense audio. <br>
    <b>RIGHT HAND:</b> Flashlight &nbsp;•&nbsp; <b>GOAL:</b> Find 3 red doors. <br>
    <b>SURVIVAL:</b> If you hear a heartbeat, keep your light on the entity.
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- DOM ---
const overlayEl = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

let xrSupported = false;

navigator.xr?.isSessionSupported('immersive-vr').then(supported => {
  xrSupported = supported;
  if (supported) {
    statusEl.innerHTML = 'Headset detected.<br>Put it on and press the button.';
    startBtn.disabled = false;
    startBtn.style.display = 'inline-block';
  } else {
    statusEl.innerHTML = 'VR headset not found. This experience requires WebXR.';
  }
}).catch(() => {
  statusEl.innerHTML = 'WebXR error. Please use a compatible browser.';
});

// --- RENDERER & SCENE ---
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
// Heavy fog for claustrophobia
scene.fog = new THREE.FogExp2(0x000000, 0.08);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 0);

// --- LIGHTING ---
// Barely any ambient light
scene.add(new THREE.AmbientLight(0x111111, 0.5));

// Red glowing light from doors
const doorLight = new THREE.PointLight(0xff0000, 0, 10);
scene.add(doorLight);

// Flashlight (Attached to camera for now, we'll move it to the controller later)
const flashlight = new THREE.SpotLight(0xffffff, 0, 30, Math.PI / 6, 0.5, 1.5);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
scene.add(flashlight);
scene.add(flashlight.target);

// --- AUDIO SYSTEM ---
let actx = null;
function initAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume();
}

// Drone sound
let droneOsc = null;
function startDrone() {
  if (!actx || droneOsc) return;
  droneOsc = actx.createOscillator();
  const gain = actx.createGain();
  droneOsc.type = 'sawtooth';
  droneOsc.frequency.value = 45; // Low rumble
  gain.gain.value = 0.05;
  droneOsc.connect(gain).connect(actx.destination);
  droneOsc.start();
}

// Heartbeat sound
let heartTimer = 0;
function playHeartbeat(rate) {
  if (!actx) return;
  const t = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(60, t);
  osc.frequency.exponentialRampToValueAtTime(30, t + 0.15);
  gain.gain.setValueAtTime(0.2, t);
  gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
  osc.connect(gain).connect(actx.destination);
  osc.start(t);
  osc.stop(t + 0.25);
}

// Scream sound
function playScream() {
  if (!actx) return;
  const t = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(800, t);
  osc.frequency.exponentialRampToValueAtTime(200, t + 1.0);
  gain.gain.setValueAtTime(0.5, t);
  gain.gain.exponentialRampToValueAtTime(0.01, t + 1.5);
  osc.connect(gain).connect(actx.destination);
  osc.start(t);
  osc.stop(t + 1.5);
}

// --- THE ENVIRONMENT ---
// Dark floor
const floorGeo = new THREE.PlaneGeometry(100, 100);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9, metalness: 0.1 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Random pillars (to break line of sight)
const pillarGeo = new THREE.BoxGeometry(1, 8, 1);
const pillarMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
for (let i = 0; i < 40; i++) {
  const pillar = new THREE.Mesh(pillarGeo, pillarMat);
  const angle = Math.random() * Math.PI * 2;
  const dist = 5 + Math.random() * 30;
  pillar.position.set(Math.cos(angle) * dist, 4, Math.sin(angle) * dist);
  scene.add(pillar);
}

// Exit Doors (Red glowing rectangles)
const doors = [];
function spawnDoor() {
  const geo = new THREE.PlaneGeometry(2, 4);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide });
  const door = new THREE.Mesh(geo, mat);
  
  const angle = Math.random() * Math.PI * 2;
  const dist = 10 + Math.random() * 15;
  door.position.set(Math.cos(angle) * dist, 2, Math.sin(angle) * dist);
  door.lookAt(0, 2, 0);
  
  scene.add(door);
  doors.push(door);
}

// --- THE ENTITY (Scary Monster) ---
const entityGroup = new THREE.Group();
// Body
const bodyGeo = new THREE.CapsuleGeometry(0.3, 1.5, 4, 8);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.2, metalness: 0.8 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 1.2;
entityGroup.add(body);
// Head (weird shape)
const headGeo = new THREE.DodecahedronGeometry(0.4, 1);
const headMat = new THREE.MeshStandardMaterial({ color: 0x2a0000, roughness: 0.1 });
const head = new THREE.Mesh(headGeo, headMat);
head.position.y = 2.3;
head.scale.set(0.8, 1.2, 0.8);
entityGroup.add(head);
// Glowing Eyes
const eyeGeo = new THREE.SphereGeometry(0.05, 8, 8);
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const eye1 = new THREE.Mesh(eyeGeo, eyeMat); eye1.position.set(-0.15, 2.35, -0.35); entityGroup.add(eye1);
const eye2 = new THREE.Mesh(eyeGeo, eyeMat); eye2.position.set(0.15, 2.35, -0.35); entityGroup.add(eye2);
// Long creepy arms
const armGeo = new THREE.CylinderGeometry(0.05, 0.02, 1.5, 6);
const arm1 = new THREE.Mesh(armGeo, bodyMat); arm1.position.set(-0.35, 1.5, 0); arm1.rotation.z = 0.2; entityGroup.add(arm1);
const arm2 = new THREE.Mesh(armGeo, bodyMat); arm2.position.set(0.35, 1.5, 0); arm2.rotation.z = -0.2; entityGroup.add(arm2);

entityGroup.position.set(0, 0, 0);
scene.add(entityGroup);

// --- GAME STATE ---
const state = {
  active: false,
  over: false,
  score: 0,
  doorsFound: 0,
  totalDoors: 3,
  health: 100,
  entitySpeed: 1.5,
  entityFrozen: false,
  lastHeartbeat: 0,
  headPos: new THREE.Vector3()
};

// --- CONTROLLERS ---
const controllers = [];
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  c.userData.hand = i === 0 ? 'left' : 'right';
  
  // Add a subtle mesh so the user knows where their hands are
  const handGeo = new THREE.SphereGeometry(0.03, 8, 8);
  const handMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
  c.add(new THREE.Mesh(handGeo, handMat));

  // If it's the right hand, attach the flashlight!
  if (i === 1) {
    c.add(flashlight);
    flashlight.position.set(0, -0.05, -0.1); // Offset slightly
    flashlight.target.position.set(0, 0, -1);
    c.add(flashlight.target);
    // Turn flashlight on
    flashlight.intensity = 5;
  }

  scene.add(c);
  controllers.push(c);
}

// --- VR SESSION ---
function requestVRSession() {
  if (!xrSupported || !navigator.xr) return;
  initAudio();
  
  navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] })
    .then(async (session) => {
      session.addEventListener('end', onSessionEnd);
      await renderer.xr.setSession(session);
      overlayEl.classList.add('hidden');
      setTimeout(() => { if (renderer.xr.isPresenting) startGame(); }, 200);
    })
    .catch((err) => {
      console.error(err);
      statusEl.textContent = 'Error: ' + err.message;
      startBtn.disabled = false;
    });
}
startBtn.addEventListener('click', requestVRSession);
startBtn.addEventListener('pointerdown', requestVRSession);

function onSessionEnd() {
  state.active = false;
  overlayEl.classList.remove('hidden');
  startBtn.disabled = false;
  startBtn.textContent = 'ENTER THE VOID';
  if (droneOsc) { droneOsc.stop(); droneOsc = null; }
}

// --- GAME LOGIC ---
function startGame() {
  state.active = true;
  state.over = false;
  state.score = 0;
  state.doorsFound = 0;
  state.health = 100;
  state.entityFrozen = false;
  
  // Clear old doors
  doors.forEach(d => scene.remove(d));
  doors.length = 0;
  
  // Spawn first door
  spawnDoor();
  
  // Reset entity
  entityGroup.position.set(0, 0, -15); 
  
  // Start audio
  initAudio();
  startDrone();
  
  startBtn.textContent = 'SURVIVE';
}

function gameOver() {
  state.active = false;
  state.over = true;
  playScream();
  startBtn.textContent = 'YOU DIED. TRY AGAIN?';
  overlayEl.classList.remove('hidden');
}

function winGame() {
  state.active = false;
  state.over = true;
  startBtn.textContent = 'YOU ESCAPED';
  overlayEl.classList.remove('hidden');
  if (droneOsc) { droneOsc.stop(); droneOsc = null; }
}

// --- UPDATE LOOP ---
const clock = new THREE.Clock();

function update(dt) {
  if (!state.active) return;

  // Get Head Position
  const cam = renderer.xr.getCamera();
  cam.updateWorldMatrix(true, false);
  state.headPos.setFromMatrixPosition(cam.matrixWorld);

  // Check Win Condition
  if (state.doorsFound >= state.totalDoors) {
    winGame();
    return;
  }

  // --- ENTITY AI ---
  const distToPlayer = entityGroup.position.distanceTo(state.headPos);
  
  // Check if player is looking at the entity
  const cameraDir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion).normalize();
  const dirToEntity = entityGroup.position.clone().sub(state.headPos).normalize();
  const dot = cameraDir.dot(dirToEntity);
  
  // If the entity is in front of the player (within field of view) AND flashlight is on
  state.entityFrozen = (dot > 0.5 && flashlight.intensity > 0);

  if (!state.entityFrozen) {
    // Move towards player
    const moveDir = state.headPos.clone().sub(entityGroup.position);
    moveDir.y = 0;
    moveDir.normalize();
    
    // Add speed based on proximity (scarier)
    const speed = distToPlayer < 5 ? state.entitySpeed * 2.5 : state.entitySpeed;
    entityGroup.position.addScaledVector(moveDir, speed * dt);
    
    // Spin creepily when moving
    entityGroup.rotation.y += dt * 2;
  } else {
    // Shake slightly when frozen
    entityGroup.position.x += (Math.random() - 0.5) * 0.02;
  }

  // Look at player
  const lookPos = state.headPos.clone();
  lookPos.y = entityGroup.position.y + 1.2; // Aim torso at player
  entityGroup.lookAt(lookPos);

  // --- AUDIO & DAMAGE ---
  if (distToPlayer < 15) {
    // Heartbeat speed increases as entity gets closer
    const hbRate = distToPlayer < 5 ? 0.3 : (distToPlayer < 10 ? 0.6 : 1.0);
    if (state.lastHeartbeat <= 0) {
      playHeartbeat(hbRate);
      state.lastHeartbeat = hbRate;
    } else {
      state.lastHeartbeat -= dt;
    }
  }

  if (distToPlayer < 1.2) {
    // Catch player
    gameOver();
  }

  // --- DOOR COLLISION ---
  for (let i = doors.length - 1; i >= 0; i--) {
    const d = doors[i];
    if (d.position.distanceTo(state.headPos) < 1.5) {
      // Reached door!
      scene.remove(d);
      doors.splice(i, 1);
      state.doorsFound++;
      state.score += 100;
      
      // Spawn next door
      if (state.doorsFound < state.totalDoors) {
        spawnDoor();
      }
      
      // Teleport player back to center for next round
      // (Wait, we can't teleport the VR camera easily without messing up tracking. 
      // Instead, we just spawn the next door far away)
      state.headPos.set(0, 1.6, 0); // Fake position for entity AI reset
      entityGroup.position.set(0, 0, -20); // Reset entity far away
    }
  }

  // Flicker the door light
  if (doors.length > 0) {
    doorLight.position.copy(doors[0].position);
    doorLight.intensity = 2 + Math.sin(state.time * 10) * 1;
  }
}

state.time = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  state.time += dt;
  update(dt);
  renderer.render(scene, camera);
});

</script>
</body>
</html>
